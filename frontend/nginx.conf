# Настройка сервера отдачи клиентского приложения.
#
# Сервер решает две задачи: отдаёт собранные файлы приложения и
# перенаправляет обращения к программному интерфейсу на серверную часть.
#
# Второе существенно: благодаря перенаправлению браузер обращается
# к программному интерфейсу по тому же адресу, с которого загружено
# приложение. Механизм разделения ресурсов между источниками (CORS)
# при этом не задействуется вовсе. Тот же порядок принят и в среде
# разработки, где перенаправление выполняет сервер сборщика Vite.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие передаваемых данных. Основной объём приложения составляют
    # файлы сценариев и стилей, которые сжимаются в несколько раз.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Признак сервера в заголовках ответа не указывается: сведения
    # о применяемом программном обеспечении и его версии облегчают
    # подбор известных уязвимостей.
    server_tokens off;

    # Приложение построено по схеме с маршрутизацией на стороне клиента:
    # адрес /portfolios/1 не соответствует файлу на диске. Если файл
    # не найден, отдаётся index.html, и маршрут разбирает само приложение.
    # Без этого правила обновление страницы по такому адресу давало бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Файлы сборки содержат отпечаток содержимого в имени, поэтому
    # при изменении файла изменяется и его имя. Это позволяет хранить
    # их в кеше браузера неограниченно долго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Сам index.html кешировать нельзя: он содержит ссылки на файлы
    # сборки, и браузер, сохранивший его прежнюю версию, продолжил бы
    # запрашивать файлы, которых больше нет.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Загрузка десятилетней истории котировок по всем инструментам
        # выполняется дольше времени ожидания, принятого по умолчанию.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
    }
}
